<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ — участники</title>
<style>
  :root{
    --bg:#1C1B1F; --surface:#26242A; --line:#3A3740; --text:#EDEAE4; --text-dim:#9C97A0; --accent-gold:#B99457;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; padding:24px; }
  h1{ font-size:20px; margin:0 0 18px 0; }
  h2{ font-size:15px; margin:28px 0 12px 0; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.03em; }
  .toolbar{ display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  input, button{ font-family:inherit; font-size:14px; }
  input{ background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:8px; padding:10px 12px; flex:1; min-width:200px; }
  button{ background:var(--accent-gold); color:#1C1B1F; border:none; border-radius:8px; padding:10px 16px; cursor:pointer; font-weight:600; }
  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th, td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th{ color:var(--text-dim); font-weight:500; }
  .tag{ display:inline-block; padding:3px 8px; border-radius:10px; font-size:12px; background:var(--surface); border:1px solid var(--line); }
  .muted{ color:var(--text-dim); }
  .status{ font-size:13px; color:var(--text-dim); margin-bottom:12px; }
  .wrap{ overflow-x:auto; }
  .answers{ font-variant-numeric:tabular-nums; white-space:nowrap; }

  .cards{ display:flex; gap:12px; flex-wrap:wrap; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 18px; min-width:140px; flex:1; }
  .card .num{ font-size:24px; font-weight:700; }
  .card .label{ font-size:12px; color:var(--text-dim); margin-top:2px; }

  .bars{ display:flex; flex-direction:column; gap:10px; max-width:520px; }
  .bar-row{ display:flex; align-items:center; gap:10px; font-size:13px; }
  .bar-row .bar-label{ width:150px; flex-shrink:0; color:var(--text-dim); }
  .bar-track{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:6px; height:16px; overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent-gold); }
  .bar-row .bar-val{ width:70px; flex-shrink:0; text-align:right; }

  .content-form{ display:flex; flex-direction:column; gap:14px; max-width:640px; }
  .content-field label{ display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:5px; }
  .content-field input, .content-field textarea{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:9px 11px; font-family:inherit;
  }
  .content-field textarea{ resize:vertical; min-height:56px; line-height:1.4; }
  .content-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:520px){ .content-grid{ grid-template-columns:1fr; } }
  .content-save-row{ display:flex; align-items:center; gap:12px; }
  .content-status{ font-size:13px; color:var(--text-dim); }
  .content-status.err{ color:var(--error, #C0554E); }
  .content-status.ok{ color:var(--accent-gold); }
</style>
</head>
<body>
  <h1>Участники диагностики</h1>
  <div class="toolbar">
    <input type="password" id="tokenInput" placeholder="Токен администратора (ADMIN_TOKEN)">
    <button onclick="load()">Показать</button>
  </div>
  <div class="status" id="status"></div>

  <div id="statsBlock" style="display:none;">
    <h2>Статистика</h2>
    <div class="cards">
      <div class="card"><div class="num" id="stTotal">—</div><div class="label">Всего регистраций</div></div>
      <div class="card"><div class="num" id="stCompleted">—</div><div class="label">Прошли тест</div></div>
      <div class="card"><div class="num" id="stBooked">—</div><div class="label">Забронировали тренинг</div></div>
    </div>

    <h2>Распределение профилей</h2>
    <div class="bars" id="profileBars"></div>

    <h2>По ролям</h2>
    <div class="bars" id="roleBars"></div>
  </div>

  <div id="contentBlock" style="display:none;">
    <h2>Содержимое лендинга (даты и тексты)</h2>
    <div class="content-form" id="contentForm">
      <div class="content-field">
        <label for="f-headline">Заголовок на первом экране</label>
        <input type="text" id="f-headline" data-key="headline">
      </div>
      <div class="content-field">
        <label for="f-intro">Подзаголовок-интро</label>
        <textarea id="f-intro" data-key="intro"></textarea>
      </div>
      <div class="content-field">
        <label for="f-trainingTitle">Название тренинга (карточка на первом экране)</label>
        <input type="text" id="f-trainingTitle" data-key="trainingTitle">
      </div>
      <div class="content-field">
        <label for="f-trainingDescription">Описание тренинга (карточка на первом экране)</label>
        <textarea id="f-trainingDescription" data-key="trainingDescription"></textarea>
      </div>
      <div class="content-grid">
        <div class="content-field">
          <label for="f-leaders">Ведущие</label>
          <input type="text" id="f-leaders" data-key="leaders">
        </div>
        <div class="content-field">
          <label for="f-groupSize">Размер группы (первый экран)</label>
          <input type="text" id="f-groupSize" data-key="groupSize">
        </div>
        <div class="content-field">
          <label for="f-audience">Участники (для кого тренинг)</label>
          <input type="text" id="f-audience" data-key="audience">
        </div>
      </div>
      <div class="content-field">
        <label for="f-preTestNote">Текст перед началом теста</label>
        <textarea id="f-preTestNote" data-key="preTestNote"></textarea>
      </div>
      <div class="content-field">
        <label for="f-invitationTitle">Заголовок приглашения (экран после результата)</label>
        <input type="text" id="f-invitationTitle" data-key="invitationTitle">
      </div>
      <div class="content-field">
        <label for="f-invitationDescription">Текст приглашения</label>
        <textarea id="f-invitationDescription" data-key="invitationDescription"></textarea>
      </div>
      <div class="content-grid">
        <div class="content-field">
          <label for="f-sessionDates">Даты тренинга</label>
          <input type="text" id="f-sessionDates" data-key="sessionDates">
        </div>
        <div class="content-field">
          <label for="f-sessionTime">Время</label>
          <input type="text" id="f-sessionTime" data-key="sessionTime">
        </div>
        <div class="content-field">
          <label for="f-sessionFormat">Формат</label>
          <input type="text" id="f-sessionFormat" data-key="sessionFormat">
        </div>
        <div class="content-field">
          <label for="f-sessionGroupSize">Размер группы (карточка приглашения)</label>
          <input type="text" id="f-sessionGroupSize" data-key="sessionGroupSize">
        </div>
      </div>
      <div class="content-field">
        <label for="f-afterNote">Текст после карточки с датами</label>
        <textarea id="f-afterNote" data-key="afterNote"></textarea>
      </div>
      <div class="content-save-row">
        <button onclick="saveContent()">Сохранить содержимое</button>
        <span class="content-status" id="contentStatus"></span>
      </div>
    </div>
  </div>

  <h2>Данные участников и ответы</h2>
  <div class="wrap">
    <table id="tbl" style="display:none;">
      <thead>
        <tr>
          <th>Имя</th><th>Роль</th><th>Телефон</th><th>Email</th><th>Профиль</th><th>Ответы</th><th>Попытки</th><th>Тест пройден</th><th>Бронь</th><th>Регистрация</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

<script>
  const savedToken = sessionStorage.getItem('adminToken');
  if(savedToken){ document.getElementById('tokenInput').value = savedToken; }

  async function load(){
    const token = document.getElementById('tokenInput').value.trim();
    const statusEl = document.getElementById('status');

    if(!token){ statusEl.textContent = 'Введите токен администратора.'; return; }
    sessionStorage.setItem('adminToken', token);
    statusEl.textContent = 'Загрузка…';

    try{
      const [participantsRes, statsRes] = await Promise.all([
        fetch('/api/admin/participants', { headers: { 'x-admin-token': token } }),
        fetch('/api/admin/stats', { headers: { 'x-admin-token': token } })
      ]);
      const participantsData = await participantsRes.json();
      const statsData = await statsRes.json();
      if(!participantsRes.ok){ throw new Error(participantsData.error || 'Ошибка запроса участников'); }
      if(!statsRes.ok){ throw new Error(statsData.error || 'Ошибка запроса статистики'); }

      renderStats(statsData);
      renderParticipants(participantsData.participants);
      await loadContentForm();

      statusEl.textContent = participantsData.participants.length
        ? ('Всего участников: ' + participantsData.participants.length)
        : 'Пока нет регистраций.';
    }catch(err){
      statusEl.textContent = 'Ошибка: ' + (err.message || 'не удалось загрузить данные');
      document.getElementById('tbl').style.display = 'none';
      document.getElementById('statsBlock').style.display = 'none';
      document.getElementById('contentBlock').style.display = 'none';
    }
  }

  function contentFields(){
    return Array.from(document.querySelectorAll('#contentForm [data-key]'));
  }

  async function loadContentForm(){
    const res = await fetch('/api/content');
    if(!res.ok) return;
    const content = await res.json();
    contentFields().forEach(el => {
      const key = el.dataset.key;
      if(typeof content[key] === 'string'){ el.value = content[key]; }
    });
    document.getElementById('contentBlock').style.display = 'block';
  }

  async function saveContent(){
    const token = document.getElementById('tokenInput').value.trim();
    const statusEl = document.getElementById('contentStatus');
    if(!token){ statusEl.textContent = 'Введите токен администратора.'; statusEl.className = 'content-status err'; return; }

    const payload = {};
    contentFields().forEach(el => { payload[el.dataset.key] = el.value; });

    statusEl.textContent = 'Сохранение…';
    statusEl.className = 'content-status';
    try{
      const res = await fetch('/api/admin/content', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if(!res.ok){ throw new Error(data.error || 'Не удалось сохранить'); }
      statusEl.textContent = 'Сохранено.';
      statusEl.className = 'content-status ok';
    }catch(err){
      statusEl.textContent = 'Ошибка: ' + (err.message || 'не удалось сохранить');
      statusEl.className = 'content-status err';
    }
  }

  function renderStats(stats){
    const block = document.getElementById('statsBlock');
    block.style.display = 'block';

    document.getElementById('stTotal').textContent = stats.total;
    document.getElementById('stCompleted').textContent = stats.completed + ' (' + stats.completionRate + '%)';
    document.getElementById('stBooked').textContent = stats.booked + ' (' + stats.bookingRate + '%)';

    const profileEntries = Object.entries(stats.profileCounts)
      .map(([key, count]) => ({ label: profileLabel(key), count }));
    renderBars('profileBars', profileEntries, stats.total);

    const roleEntries = Object.entries(stats.byRole)
      .sort((a, b) => b[1] - a[1])
      .map(([label, count]) => ({ label, count }));
    renderBars('roleBars', roleEntries, stats.total);
  }

  function renderBars(containerId, entries, total){
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    if(!entries.length || !total){
      container.innerHTML = '<div class="muted">Нет данных</div>';
      return;
    }
    entries.forEach(({ label, count }) => {
      const pct = total ? Math.round((count / total) * 100) : 0;
      const row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML =
        '<div class="bar-label">' + escapeHtml(label) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="bar-val">' + count + ' (' + pct + '%)</div>';
      container.appendChild(row);
    });
  }

  function renderParticipants(participants){
    const tbl = document.getElementById('tbl');
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '';

    participants
      .slice()
      .reverse()
      .forEach(p => {
        const tr = document.createElement('tr');

        const answersText = Array.isArray(p.answers) ? p.answers.join(', ') : '—';

        const cells = [
          { text: p.name || '—' },
          { text: p.role || '—' },
          { text: p.phone || '—' },
          { text: p.email || '—' },
          { text: p.profile ? profileLabel(p.profile) : '—' },
          { text: answersText, className: 'answers' },
          { text: `${(p.attempts || []).length}/5` },
          { text: p.resultAt ? formatDate(p.resultAt) : '—' },
          { text: p.booked ? 'да' : 'нет' },
          { text: p.createdAt ? formatDate(p.createdAt) : '—' }
        ];

        cells.forEach(({ text, className }) => {
          const td = document.createElement('td');
          if(className) td.className = className;
          td.textContent = text;
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });

    tbl.style.display = participants.length ? 'table' : 'none';
  }

  function profileLabel(key){
    return { AV: 'Сглаживающий', B: 'Борец', G: 'Аналитик' }[key] || key;
  }

  function formatDate(iso){
    const d = new Date(iso);
    return d.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function escapeHtml(s){
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  if(savedToken){ load(); }
</script>
</body>
</html>
